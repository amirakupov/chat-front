name: ci

on:
  push:
    branches: [main]
    # Without this a `git tag v1.0.0 && git push --tags` would not run anything, and the
    # type=ref,event=tag rule below would never produce a version tag.
    tags: ["v*"]
  pull_request:

# A new push to the same branch makes the previous run pointless — cancel it instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job on purpose. Splitting lint/test/build across jobs would repeat `npm ci` three times,
  # and here the install costs more than every check put together.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      # Cheap checks first: they fail in seconds, the build takes minutes.
      - run: npm run lint

      # next-env.d.ts and the route types live in .next and are gitignored, so a bare `tsc` on a
      # fresh checkout would fail on missing globals. `next typegen` writes them without a build.
      - run: npm run typecheck

      - run: npm test

      # .next/cache is what makes the second build fast; setup-node's cache does not cover it.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'lib/**', 'components/**') }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # Publishes ghcr.io/<owner>/<repo>. Pull requests only build (a fork's token cannot push, and an
  # unreviewed branch has no business landing in the registry); pushes to main and tags publish.
  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # GITHUB_TOKEN can write packages under this repository's owner and nowhere else. Publishing
      # to ghcr.io/digital-ecosystem would need the repo moved into the org, or a PAT.
      packages: write
    steps:
      - uses: actions/checkout@v5

      # NEXT_PUBLIC_API_URL is compiled into the client bundle, so an image built without it is
      # quietly broken: an empty value is not null, `??` in lib/api.ts does not catch it, and every
      # request goes to a relative path. Better to fail here than to ship that to the VPS.
      - name: Require the API URL
        if: github.event_name == 'push'
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Set the repository variable NEXT_PUBLIC_API_URL (Settings → Secrets and variables → Actions → Variables). It is baked into the bundle at build time; a runtime env var cannot replace it."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # A tag push gives v1.2.3, main gives :latest, and every build is also addressable by
          # commit — the deploy pins a sha when :latest is too vague to roll back from.
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Includes org.opencontainers.image.source, which is what links the package to this
          # repository on GitHub — without it the package page has no code behind it.
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
          # Layer cache in the Actions cache, so an unchanged lockfile skips npm ci entirely.
          cache-from: type=gha
          cache-to: type=gha,mode=max
